name: Deploy to GCP VM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gcp-vm-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10.33.2"
  GCP_PROJECT: project-0d572704-81fc-488d-94b
  GCP_REGION: us-central1
  VM_HOST: 34.55.40.175
  VM_USER: aditya_bedrock
  DEPLOY_PATH: /opt/voiceforge-data
  GAR_REPOSITORY: voiceforge-containers
  PUBLIC_APP_URL: https://vocal.devdeepak.me
  PUBLIC_API_URL: https://vocal.devdeepak.me/api/v1

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @voiceforge/api run db:generate

      - name: Build shared package
        run: pnpm --filter @voiceforge/shared run build

      - name: Typecheck workspaces
        run: pnpm -r --if-present run typecheck

  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate deployment inputs
        env:
          GCP_VM_SSH_KEY: ${{ secrets.GCP_VM_SSH_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=()
          for var in GCP_VM_SSH_KEY NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!var:-}" ]; then
              missing+=("${var}")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub secret/variable: %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Auth to GCP via Workload Identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/51657380046/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deploy@project-0d572704-81fc-488d-94b.iam.gserviceaccount.com

      - name: Configure Docker for GAR
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Extract metadata
        id: meta
        run: |
          IMAGE_TAG=$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::8}
          REGISTRY="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.GAR_REPOSITORY }}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "registry=${REGISTRY}" >> $GITHUB_OUTPUT

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.registry }}/voiceforge-web:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.registry }}/voiceforge-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ env.PUBLIC_APP_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.registry }}/voiceforge-api:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.registry }}/voiceforge-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Prepare VM deployment path
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VM_HOST }}
          username: ${{ env.VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          script: |
            set -euo pipefail
            DEPLOY_USER="$(id -un)"
            DEPLOY_GROUP="$(id -gn)"
            sudo mkdir -p "${{ env.DEPLOY_PATH }}/infra/docker" "${{ env.DEPLOY_PATH }}/infra/nginx"
            sudo chown -R "${DEPLOY_USER}:${DEPLOY_GROUP}" "${{ env.DEPLOY_PATH }}/infra/docker" "${{ env.DEPLOY_PATH }}/infra/nginx"

      - name: Sync deployment files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VM_HOST }}
          username: ${{ env.VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          target: ${{ env.DEPLOY_PATH }}
          source: infra/docker/docker-compose.gcp.yml,infra/nginx/nginx.conf
          overwrite: true

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VM_HOST }}
          username: ${{ env.VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd "${{ env.DEPLOY_PATH }}"

            COMPOSE_FILE="infra/docker/docker-compose.gcp.yml"
            export COMPOSE_PROJECT_NAME="docker"
            export IMAGE_TAG="${{ steps.meta.outputs.image_tag }}"

            test -f "${COMPOSE_FILE}"
            test -f "infra/nginx/nginx.conf"
            test -f ".env"
            docker compose -f "${COMPOSE_FILE}" config --quiet

            docker container prune -f || true
            docker image prune -af --filter "until=24h" || true
            docker builder prune -af || true
            docker system df || true

            gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin "https://${{ env.GCP_REGION }}-docker.pkg.dev"

            docker compose -f "${COMPOSE_FILE}" pull web api
            docker compose -f "${COMPOSE_FILE}" run --rm --no-deps api npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
            docker compose -f "${COMPOSE_FILE}" up -d --remove-orphans

            for attempt in $(seq 1 24); do
              if curl -sf --max-time 10 http://localhost:4000/api/v1/health >/dev/null; then
                echo "API healthy"
                break
              fi
              if [ "${attempt}" = "24" ]; then
                docker compose -f "${COMPOSE_FILE}" logs api --tail=120
                exit 1
              fi
              sleep 5
            done

            for attempt in $(seq 1 24); do
              if curl -sf --max-time 10 http://localhost:3000/api/health >/dev/null; then
                echo "Web healthy"
                break
              fi
              if [ "${attempt}" = "24" ]; then
                docker compose -f "${COMPOSE_FILE}" logs web --tail=120
                exit 1
              fi
              sleep 5
            done

            docker compose -f "${COMPOSE_FILE}" restart nginx

            for attempt in $(seq 1 24); do
              if curl -sf --max-time 10 "${{ env.PUBLIC_API_URL }}/health" >/dev/null; then
                echo "Public API healthy"
                break
              fi
              if [ "${attempt}" = "24" ]; then
                docker compose -f "${COMPOSE_FILE}" logs nginx --tail=80
                exit 1
              fi
              sleep 5
            done

            for attempt in $(seq 1 24); do
              if curl -sf --max-time 10 "${{ env.PUBLIC_APP_URL }}" >/dev/null; then
                echo "Public web healthy"
                break
              fi
              if [ "${attempt}" = "24" ]; then
                docker compose -f "${COMPOSE_FILE}" logs nginx --tail=80
                exit 1
              fi
              sleep 5
            done

            docker compose -f "${COMPOSE_FILE}" ps

      - name: Verify public endpoints from runner
        run: |
          curl -fsS --retry 6 --retry-delay 5 --max-time 15 "${{ env.PUBLIC_APP_URL }}" >/dev/null
          curl -fsS --retry 6 --retry-delay 5 --max-time 15 "${{ env.PUBLIC_API_URL }}/health" >/dev/null
