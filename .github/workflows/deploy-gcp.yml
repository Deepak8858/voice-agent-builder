name: Deploy to GCP VM

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_PROJECT: project-0d572704-81fc-488d-94b
  GCP_REGION: us-central1
  VM_HOST: 34.55.40.175
  VM_USER: aditya_bedrock
  DEPLOY_PATH: /opt/voiceforge-data

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Auth to GCP via Workload Identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/51657380046/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deploy@project-0d572704-81fc-488d-94b.iam.gserviceaccount.com

      - name: Configure Docker for GAR
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Extract metadata
        id: meta
        run: |
          IMAGE_TAG=$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::8}
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: true
          provenance: false
          tags: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/voiceforge-containers/voiceforge-web:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          build-args: |
            NEXT_PUBLIC_API_URL=https://vocal.devdeepak.me/api/v1
            NEXT_PUBLIC_APP_URL=https://vocal.devdeepak.me
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          provenance: false
          tags: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/voiceforge-containers/voiceforge-api:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VM_HOST }}
          username: ${{ env.VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          script: |
            set -e
            cd "${{ env.DEPLOY_PATH }}"

            IMAGE_TAG="${{ steps.meta.outputs.image_tag }}"
            COMPOSE_FILE="infra/docker/docker-compose.gcp.yml"
            WEB_IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/voiceforge-containers/voiceforge-web:${IMAGE_TAG}"
            API_IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/voiceforge-containers/voiceforge-api:${IMAGE_TAG}"

            test -f "${COMPOSE_FILE}"
            sudo sed -i -E "s|image: .*voiceforge-web:[^[:space:]]+|image: ${WEB_IMAGE}|" "${COMPOSE_FILE}"
            sudo sed -i -E "s|image: .*voiceforge-api:[^[:space:]]+|image: ${API_IMAGE}|" "${COMPOSE_FILE}"

            docker compose -f "${COMPOSE_FILE}" pull web api
            docker compose -f "${COMPOSE_FILE}" up -d --remove-orphans

            for attempt in $(seq 1 24); do
              if curl -sf --max-time 10 http://localhost:4000/api/v1/health >/dev/null; then
                echo "API healthy"
                break
              fi
              if [ "${attempt}" = "24" ]; then
                docker compose -f "${COMPOSE_FILE}" logs api --tail=120
                exit 1
              fi
              sleep 5
            done

            for attempt in $(seq 1 24); do
              if curl -sf --max-time 10 http://localhost:3000/api/health >/dev/null; then
                echo "Web healthy"
                break
              fi
              if [ "${attempt}" = "24" ]; then
                docker compose -f "${COMPOSE_FILE}" logs web --tail=120
                exit 1
              fi
              sleep 5
            done

            docker compose -f "${COMPOSE_FILE}" restart nginx
            for attempt in $(seq 1 24); do
              if curl -sf --max-time 10 https://vocal.devdeepak.me/api/v1/health >/dev/null; then
                echo "Public API healthy"
                break
              fi
              if [ "${attempt}" = "24" ]; then
                docker compose -f "${COMPOSE_FILE}" logs nginx --tail=80
                exit 1
              fi
              sleep 5
            done

            for attempt in $(seq 1 24); do
              if curl -sf --max-time 10 https://vocal.devdeepak.me >/dev/null; then
                echo "Public web healthy"
                break
              fi
              if [ "${attempt}" = "24" ]; then
                docker compose -f "${COMPOSE_FILE}" logs nginx --tail=80
                exit 1
              fi
              sleep 5
            done

      - name: Run Prisma migration
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VM_HOST }}
          username: ${{ env.VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          script: |
            set -e
            cd "${{ env.DEPLOY_PATH }}"
            docker compose -f infra/docker/docker-compose.gcp.yml exec -T api npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
