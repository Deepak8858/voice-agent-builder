# =============================================================================
# VoiceForge AI — Quality Gate
# =============================================================================
# The deploy workflows (AWS, GCP, Azure) are all workflow_dispatch-only, since
# Azure is the sole production target and deploys are operator-initiated.
# That left the repository with no checks running automatically on a pull
# request. This workflow is the automatic gate: it never deploys and never
# needs cloud credentials.
# =============================================================================

name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  # 22.22 is the floor, not a preference. Two dependency constraints set it:
  #   - posthog-node declares "^20.20.0 || >=22.22.0".
  #   - jsdom 30, which is apps/web's vitest DOM environment, declares
  #     "^22.22.2 || ^24.15.0 || >=26.0.0" and pulls undici 8, whose
  #     lib/web/webidl reads markAsUncloneable from node:worker_threads. That
  #     export landed in Node 22.10 and was never backported to 20.x, so the
  #     entire web suite aborted on 20.20 with "TypeError:
  #     webidl.util.markAsUncloneable is not a function" while passing on every
  #     developer machine. 20.x was never a Node version jsdom 30 supported.
  # A bare "22" is still avoided for the reason the old "20" was: it lets a
  # runner image resolve to a 22.x below the constraints above. "22.22" resolves
  # to the newest published 22.22.x (22.22.3 at time of writing), which clears
  # jsdom's ^22.22.2 floor; do not narrow this to 22.22.0 or 22.22.1. Node 20
  # reached end-of-life on 2026-04-30, so the 20.x half of the engines range is
  # legacy tolerance rather than a target.
  #
  # Keep in sync with .depot/workflows/quality-gate.yml, which pins the same
  # value, and with infra/docker/Dockerfile.*, which are on the same 22.22 line
  # pinned to an exact patch (node:22.22.3-bookworm-slim). The shapes differ on
  # purpose — CI tracks the newest 22.22.x so it picks up patch fixes, while a
  # production runtime image is pinned for reproducibility — but the major.minor
  # must not diverge.
  NODE_VERSION: "22.22"
  PNPM_VERSION: "10.33.2"

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # gitleaks needs history to diff a PR range rather than only the tip.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      # --frozen-lockfile also asserts that pnpm-lock.yaml agrees with every
      # package.json, including the pnpm.overrides block. A drifted lockfile
      # fails here instead of silently installing unpinned transitives.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan repository for secrets
        # @v3 is @v2 with the action runtime moved from Node 20 to Node 24 (no
        # input, output or behaviour change). GitHub-hosted runners drop Node 20
        # on 2026-09-16, which would fail this step before the scan even starts.
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Named explicitly rather than relying on gitleaks auto-detecting
          # `.gitleaks.toml`, so a future action version that changes its
          # discovery rules cannot silently drop the allowlist and fail the gate
          # on the same test fixtures again.
          GITLEAKS_CONFIG: .gitleaks.toml
          # The action defaults to gitleaks 8.24.3, which predates root-level
          # `[[allowlists]]` (added in 8.25.0) and silently IGNORES every block
          # in our config — the sentinel exemptions were dead and the gate
          # failed on historical test-fixture commits. Pin a version that
          # actually parses the config it is handed.
          GITLEAKS_VERSION: "8.30.1"

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Generate Prisma client
        run: pnpm --filter @voiceforge/api run db:generate

      - name: Build shared package
        run: pnpm --filter @voiceforge/shared run build

      - name: Typecheck
        run: pnpm -r --if-present run typecheck

      - name: Lint
        run: pnpm -r --if-present run lint

      # Recursive, so apps/web is included. The root "test" script only covers
      # shared + api + livekit-agent and would silently skip the web suite.
      - name: Test
        run: pnpm -r --if-present run test

      - name: Build API
        run: pnpm --filter @voiceforge/api run build

      # The web build prerenders pages that construct a Supabase client, so it
      # needs the public env values. These are public by definition (they ship
      # in the browser bundle); no service-role or secret key is used here.
      - name: Build web
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm --filter @voiceforge/web run build

  # The audit gate above checks the dependency graph resolved by pnpm in the
  # repository. It says nothing about what the container images actually ship.
  # Those diverged once already: the Dockerfiles deleted pnpm-lock.yaml and ran
  # `npm install`, and because npm ignores `pnpm.overrides`, every patched
  # transitive silently reverted to a vulnerable version in production while
  # this workflow stayed green. This job builds the real images and asserts the
  # shipped graph matches the audited one.
  image-dependency-integrity:
    name: Images ship the audited dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          tags: voiceforge-api:ci
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          tags: voiceforge-web:ci
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          # Dockerfile.web hard-fails when NEXT_PUBLIC_BILLING_MODE is absent or
          # is anything other than demo|live, so it must be passed here even
          # though this job only checks the shipped dependency graph. The default
          # keeps the gate independent of repository configuration; the value
          # baked into a CI-only image is never deployed.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
            NEXT_PUBLIC_BILLING_MODE=${{ vars.NEXT_PUBLIC_BILLING_MODE || 'demo' }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Assert images ship the patched dependency versions
        run: |
          set -euo pipefail
          for image in voiceforge-api:ci voiceforge-web:ci; do
            echo "::group::$image"
            docker run --rm \
              -v "$PWD/scripts:/verify:ro" \
              --entrypoint node \
              "$image" /verify/verify-image-deps.mjs
            echo "::endgroup::"
          done

  # Fails the PR if credential-bearing scratch directories are ever tracked
  # again. These were committed once before and required a history rewrite.
  no-tracked-secrets:
    name: No tracked credential paths
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assert credential scratch paths are untracked
        run: |
          set -euo pipefail
          blocked=0
          for path in ".codex-browser-shots" "supabase/.temp" ".claude/worktrees"; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "::error::$path is tracked in git; it may contain credentials."
              blocked=1
            fi
          done
          exit "$blocked"
