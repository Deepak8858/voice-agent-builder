server {
    listen 80;
    listen [::]:80;
    server_name incfrog.ai www.incfrog.ai origin.incfrog.ai;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Only the NestJS global prefix goes to the API container. Next.js owns
    # every other /api/* route handler (/api/proxy, /api/auth, /api/health,
    # /api/billing, /api/onboarding) - routing all of /api/ here 404s them.
    location ^~ /api/v1/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }

    # First boot has no certificate. Serve the application over HTTP so nginx
    # remains usable while Certbot completes HTTP-01. The entrypoint hook swaps
    # this location to an HTTPS redirect whenever the certificate is present.
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
