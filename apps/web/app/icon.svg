<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="VoiceForge AI">
  <defs>
    <linearGradient id="vf-grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="0.5" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#166534"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#vf-grad)"/>
  <!-- Voice waveform shaped as a "V" -->
  <g fill="#ffffff">
    <rect x="12" y="15" width="4" height="34" rx="2"/>
    <rect x="18" y="20" width="4" height="24" rx="2"/>
    <rect x="24" y="24" width="4" height="16" rx="2"/>
    <rect x="30" y="28" width="4" height="8"  rx="2"/>
    <rect x="36" y="24" width="4" height="16" rx="2"/>
    <rect x="42" y="20" width="4" height="24" rx="2"/>
    <rect x="48" y="15" width="4" height="34" rx="2"/>
  </g>
</svg>
